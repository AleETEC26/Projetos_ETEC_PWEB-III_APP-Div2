<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <title>Ingredientes</title>
</head>

<body>
    <div class="container-fluid">
        <header>

        </header>
        <main>
            <div class="container mt-4">
                <h2>Cadastro de Ingredientes</h2>
                <form id="frmIngrediente">
                    <div class="mb-3">
                        <label for="nome">Ingrediente:<span class="text-danger">*</span></label>
                        <input type="text" name="nome" id="nome" class="form-control" required>
                        <label for="vlunitario">Valor unitário:<span class="text-danger">*</span></label>
                        <input type="number" name="vlunitario" id="vlunitario" class="form-control" step="0.01" min="0" required>
                    </div>
                    <button type="submit" class="btn btn-primary">GRAVAR</button>
                    <button type="button" id="limpar" class="btn btn-info d-none">LIMPAR</button>
                </form>
                <script>
                    document.getElementById('limpar').addEventListener('click', limpar);
                    function limpar(){
                        const btnLimpar = document.querySelector('#limpar');
                        const btnGravar = document.querySelector('#frmIngrediente button[type="submit"]');
                        const inputNome = document.querySelector('#nome');
                        const inputValor = document.querySelector('#vlunitario');
                        // const txt = document.querySelector('#frmCategoria input[type="text"]');

                        btnGravar.onclick = null;
                        btnGravar.classList.remove('btn-danger');
                        btnGravar.classList.remove('btn-warning');
                        btnGravar.classList.add('btn-primary');
                        btnGravar.textContent = 'GRAVAR';

                        btnLimpar.classList.add('d-none');

                        inputNome.classList.remove('text-danger');

                        inputNome.value = '';
                        inputValor.value = '';
                    }
                </script>
            </div>
            <!-- Listagem visual HTML CSS -->
            <div class="container mt-3">
                <div class="row">
                    <div class="col-sm-3">
                        <b>Ingrediente</b>
                    </div>
                    <div class="col-sm-2">
                        <b>Valor unitário</b>
                    </div>
                </div>
            </div>
            <div class="container" id="gridIngrediente">
                <!-- aqui o javascript cria a tabela -->
            </div>
            <!-- script para conectar ao servicor da api e chamar o serviço especifico -->
            <script>
                const apiUrl = 'http://localhost/Projetos_ETEC_PWEB-III_Div2/api/ingredientes/';

                document.getElementById('frmIngrediente').addEventListener('submit', function (event) {
                    event.preventDefault();
                    let nome = document.getElementById('nome').value;
                    let vlunitario = document.getElementById('vlunitario').value;

                    fetch(`${apiUrl}iingrediente.php?jsn=${JSON.stringify({ nome, vlunitario })}`)
                        .then(response => response.text())
                        .then(() => {
                            alert('Ingrediente cadastrado com sucesso!');
                            window.location.reload();
                        });
                });

                function carregaringredientes() {
                    fetch(`${apiUrl}singrediente.php`)
                        .then(response => response.json())
                        .then(data => {
                            let gridIngrediente = document.getElementById('gridIngrediente');
                            gridIngrediente.innerHTML = '';
                            data.forEach(ds => {
                                let valorformato = Number(ds.valor).toLocaleString('pt-Br', {
                                style: 'currency',
                                currency: 'BRL'
                            });
                                gridIngrediente.innerHTML += `
                            <div class="row mt-2">
                                <div class="col-sm-3">${ds.nome}</div>
                                <div class="col-sm-2">${valorformato}</div>
                                <div class="col-sm-4">
                                    <button class="btn btn-warning" onclick="editaringrediente(${ds.id}, '${ds.nome}', '${ds.valor}')">Editar</button>
                                    <button class="btn btn-danger" onclick="deletaringrediente(${ds.id}, '${ds.nome}')">Excluir</button>
                                </div>
                            </div>`;
                            });
                        });
                }

                function editaringrediente(id, nome, valor) {
                    document.getElementById('nome').value = nome;
                    document.getElementById('vlunitario').value = valor;
                    const btn = document.querySelector('#frmIngrediente button[type="submit"]');
                    const txt = document.querySelector('#frmIngrediente input[type="text"]');
                    const btnLimpar = document.querySelector('#limpar');
                    btn.textContent = 'ATUALIZAR';
                    btn.classList.remove('btn-primary');
                    btn.classList.remove('btn-danger');
                    btn.classList.add('btn-warning');
                    txt.classList.remove('text-danger');
                    btnLimpar.classList.remove('d-none');
                    btn.onclick = function (event) {
                        event.preventDefault();
                        let unome = document.getElementById('nome').value;
                        let uvlunitario = document.getElementById('vlunitario').value;
                        fetch(`${apiUrl}uingrediente.php?jsn=${JSON.stringify({ nome: unome, valor:uvlunitario, id })}`)
                            .then(response => response.text())
                            .then(() => {
                                alert('Ingrediente alterado!');
                                window.location.reload();
                            });
                    }
                }

                function deletaringrediente(id, nome) {
                    document.getElementById('nome').value = 'Deseja realmente excluir ' + nome + '?';
                    const btn = document.querySelector('#frmIngrediente button[type="submit"]');
                    const txt = document.querySelector('#frmIngrediente input[type="text"]');
                    const btnLimpar = document.querySelector('#limpar');
                    btn.textContent = 'EXCLUIR';
                    btn.classList.remove('btn-primary');
                    btn.classList.add('btn-danger');
                    txt.classList.add('text-danger');
                    btnLimpar.classList.remove('d-none');
                    btn.onclick = function (event) {
                        event.preventDefault();
                        fetch(`${apiUrl}dingrediente.php?jsn=${JSON.stringify({ id })}`)
                            .then(response => response.text())
                            .then(() => {
                                alert('Ingrediente Excluido!');
                                window.location.reload();
                            });
                    }
                }
                window.onload = carregaringredientes;
            </script>
        </main>
        <footer>

        </footer>
    </div>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
</body>

</html>
