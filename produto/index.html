<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <title>Produto</title>
</head>

<body>
    <div class="container-fluid">
        <header>

        </header>
        <main>
            <div class="container mt-4">
                <h2>Cadastro de Produtos</h2>
                <form id="frmProduto">
                    <div class="mb-3">
                        <label for="nome">Produtos:<span class="text-danger">*</span></label>
                        <input type="text" name="nome" id="nome" class="form-control" require>
                        <label for="vlvenda">Valor de venda (R$):<span class="text-danger">*</span></label>
                        <input type="text" name="vlvenda" id="vlvenda" class="form-control" require>
                        <label for="cat">Categoria:<span class="text-danger">*</span></label>
                        <!-- <input type="number" name="cat" id="cat" class="form-control" require> -->
                        <select name="cat" id="cat" class="form-control" aria-label="Default select example">Selecione uma categoria</select>
                        <script>
                            function carregarcategorias(){
                                fetch(`http://localhost/Projetos_ETEC_PWEB-III_Div2/api/categorias/scategoria.php`)
                                .then(response => response.json())
                                .then(data => {
                                let combobox = document.getElementById('cat');
                                combobox.innerHTML = `<select name="cat" id="cat" class="form-control" aria-label="Default select example">
                                    <option value="" selected disable>Selecione a categoria</option>
                                    </select>`;
                                data.forEach(ds => {
                                    combobox.innerHTML += `
                                    <option value="${ds.id}">${ds.nome}</option>
                                    </select>`
                                    });
                                })
                            }
                            carregarcategorias();
                        </script>
                    </div>
                    <button type="submit" class="btn btn-primary">GRAVAR</button>
                </form>
            </div>
            <!-- Listagem visual HTML CSS -->
            <div class="container mt-3">
                <div class="row">
                    <div class="col-sm-3">
                        <b>Produto</b>
                    </div>
                    <div class="col-sm-2">
                        <b>Valor venda (R$)</b>
                    </div>
                    <div class="col-sm-4">
                        <b>Categoria</b>
                    </div>
                </div>
            </div>
            <div class="container" id="gridProduto">
                <!-- aqui o javascript cria a tabela -->
            </div>
            <!-- script para conectar ao servicor da api e chamar o serviço especifico -->
            <script>
                const apiUrl = 'http://localhost/Projetos_ETEC_PWEB-III_Div2/api/produtos/';

                document.getElementById('frmProduto').addEventListener('submit', function (event) {
                    event.preventDefault();
                    let nome = document.getElementById('nome').value;
                    let vlvenda = document.getElementById('vlvenda').value;
                    let cat = document.getElementById('cat').value;

                    fetch(`${apiUrl}iproduto.php?jsn=${JSON.stringify({ nome, vlvenda, cat })}`)
                        .then(response => response.text())
                        .then(() => {
                            alert('Produto cadastrado com sucesso!');
                            window.location.reload();
                        });
                });

                function carregarprodutos() {
                    fetch(`${apiUrl}sproduto.php`)
                        .then(response => response.json())
                        .then(data => {
                            let gridProduto = document.getElementById('gridProduto');
                            gridProduto.innerHTML = '';
                            data.forEach(ds => {
                                gridProduto.innerHTML += `
                            <div class="row mt-2">
                                <div class="col-sm-3">${ds.nome}</div>
                                <div class="col-sm-2">${ds.vlvenda}</div>
                                <div class="col-sm-1">${ds.cat}</div>
                                <div class="col-sm-4">
                                    <button class="btn btn-warning" onclick="editarproduto(${ds.id}, '${ds.nome}', '${ds.vlvenda}', '${ds.cat}')">Editar</button>
                                    <button class="btn btn-danger" onclick="deletarproduto(${ds.id}, '${ds.nome}')">Excluir</button>
                                </div>
                            </div>`;
                            });
                        });
                }

                function editarproduto(id, nome, vlvenda, cat) {
                    document.getElementById('nome').value = nome;
                    document.getElementById('vlvenda').value = vlvenda;
                    document.getElementById('cat').value = cat;
                    const btn = document.querySelector('#frmProduto button[type="submit"]');
                    const txt = document.querySelector('#frmProduto input[type="text"]');
                    btn.textContent = 'ATUALIZAR';
                    btn.classList.remove('btn-primary');
                    btn.classList.remove('btn-danger');
                    btn.classList.add('btn-warning');
                    txt.classList.remove('text-danger');
                    btn.onclick = function (event) {
                        event.preventDefault();
                        let unome = document.getElementById('nome').value;
                        let uvlvenda = document.getElementById('vlvenda').value;
                        let ucat = document.getElementById('cat').value;
                        fetch(`${apiUrl}uproduto.php?jsn=${JSON.stringify({ nome: unome, vlvenda:uvlvenda, cat:ucat, id })}`)
                            .then(response => response.text())
                            .then(() => {
                                alert('Produto alterado!');
                                window.location.reload();
                            });
                    }
                }

                function deletarproduto(id, nome) {
                    document.getElementById('nome').value = 'Deseja realmente excluir ' + nome + '?';
                    const btn = document.querySelector('#frmProduto button[type="submit"]');
                    const txt = document.querySelector('#frmProduto input[type="text"]');
                    btn.textContent = 'EXCLUIR';
                    btn.classList.remove('btn-primary');
                    btn.classList.add('btn-danger');
                    txt.classList.add('text-danger');
                    btn.onclick = function (event) {
                        event.preventDefault();
                        fetch(`${apiUrl}dproduto.php?jsn=${JSON.stringify({ id })}`)
                            .then(response => response.text())
                            .then(() => {
                                alert('Produto Excluido!');
                                window.location.reload();
                            });
                    }
                }
                window.onload = carregarprodutos;
            </script>
        </main>
        <footer>

        </footer>
    </div>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
</body>

</html>
